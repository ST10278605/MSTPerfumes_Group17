services:
  php:
    image: php:8.2-fpm
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1

  web:
    build: .
    container_name: MST_website_web
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8.0
    container_name: MST_website_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mstwebsite
      MYSQL_USER: websiteuser
      MYSQL_PASSWORD: websitepassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mywebsite_phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"

volumes:
  mysql_data: {}
